<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8952a"/>
      <stop offset="50%" style="stop-color:#e8c96a"/>
      <stop offset="100%" style="stop-color:#b8952a"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2340"/>
      <stop offset="100%" style="stop-color:#0d1220"/>
    </linearGradient>
  </defs>

  <!-- Shield badge -->
  <path d="M110 28 L170 28 L170 135 L140 155 L110 135 Z" fill="url(#navyGrad)"/>
  <path d="M110 28 L170 28 L170 135 L140 155 L110 135 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M116 35 L164 35 L164 131 L140 148 L116 131 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Steering wheel -->
  <circle cx="140" cy="88" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
  <circle cx="140" cy="88" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="140" y1="60" x2="140" y2="78" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="98" x2="140" y2="116" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="88" x2="130" y2="88" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="88" x2="168" y2="88" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="68" x2="132" y2="80" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="148" y1="96" x2="160" y2="108" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="160" y1="68" x2="148" y2="80" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="108" x2="132" y2="96" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Three dots at shield base -->
  <circle cx="133" cy="143" r="3.5" fill="url(#goldGrad)"/>
  <circle cx="140" cy="143" r="3.5" fill="url(#goldGrad)"/>
  <circle cx="147" cy="143" r="3.5" fill="url(#goldGrad)"/>

  <!-- Wordmark -->
  <text x="192" y="90"
    font-family="'Palatino Linotype', Palatino, Georgia, serif"
    font-size="46" font-weight="700" letter-spacing="1" fill="#ffffff">Private</text>

  <text x="192" y="138"
    font-family="'Palatino Linotype', Palatino, Georgia, serif"
    font-size="46" font-weight="700" letter-spacing="1" fill="#ffffff">Transfers<tspan fill="url(#goldGrad)" font-weight="400">.ie</tspan></text>

  <!-- Divider lines + tagline -->
  <line x1="192" y1="153" x2="300" y2="153" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <line x1="490" y1="153" x2="598" y2="153" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <text x="395" y="157"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" letter-spacing="4.5" text-anchor="middle" fill="#e8c96a">PREMIUM CHAUFFEUR · IRELAND</text>
</svg>
